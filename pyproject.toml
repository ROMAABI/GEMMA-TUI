[project]
name = "gemma-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "platformdirs",
  "rich",
  "textual",
  "typer",
]

[project.scripts]
gemma = "app.cli:app"
gemma-local = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "config*", "core*", "models*", "sessions*", "tui*", "utils*"]
